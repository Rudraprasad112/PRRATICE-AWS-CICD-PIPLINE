name: Deploy Lambda

on:
  push:
    branches:
      - main
      - test

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install system tools
      run: |
        sudo apt-get update
        sudo apt-get install -y jq zip

    - name: Set enviroment variables
      id: set-env-vars
      run: |
        if [[ "${{ github.ref_name }}" == "main" ]]; then 
          echo "ENV=prod" >> $GITHUB_ENV
          echo "API_KEY=prod_api_key" >> $GITHUB_ENV
          echo "LOG_LEVEL=INFO" >> $GITHUB_ENV
        else
          echo "ENV=test" >> $GITHUB_ENV
          echo "API_KEY=test_api_key" >> $GITHUB_ENV
          echo "LOG_LEVEL=DEBUG" >> $GITHUB_ENV
        fi
    - name: Package Lambda Function
      run: |
        cd lambda_file
        python3.11 -m venv venv
        source venv/bin/activate
        mkdir package
        pip install --no-cache-dir -r requirement.txt -t ./package
        cp lambda_function.py ./package/
        cd package
        zip -r ../../lambda.zip .
        cd ../..
    - name: Deploy aws Lambda
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
      run: |
        FUNCTION_NAME="cicd_lambda_${{ github.ref_name }}"
        REGION="us-east-1"
        echo deploying to lambda function : $FUNCTION_NAME

        # check if the lambda function exists
        FUNCTION_EXISTS=$(aws lambda get-function --function-name $FUNCTION_NAME --region $REGION || echo "false")

        ENV_VARIABLES="Variables={ENV=${{ env.ENV }},API_KEY=${{ env.API_KEY }},LOG_LEVEL=${{ env.LOG_LEVEL }}}"

        if [ "$FUNCTION_EXISTS" = "false" ]; then
          echo "creating lambda function $FUNCTION_NAME..."
          aws lambda create-function \
            --function-name $FUNCTION_NAME \
            --runtime python3.11 \
            --role arn:aws:iam::048711827193:role/service-role/s3-lambda-notification-lambda-role-8sev4t3p \
            --handler lambda_function.lambda_handler \
            --timeout 300 \
            --zip-file fileb://lambda.zip \
            --region $REGION \
            --environment "$ENV_VARIABLES"
        else
          echo "updating lambda function $FUNCTION_NAME"
          aws lambda update-function-code \
            --function-name $FUNCTION_NAME \
            --region $REGION \
            --zip-file fileb://lambda.zip
          
          # wait for function update complete
          echo "waiting for update function $FUNCTION_NAME..."
          while true; do
            UPDATE_STATUS=$(aws lambda get-function --function-name $FUNCTION_NAME --region $REGION --query 'Configuration.LastUpdateStatus' --output text)
            if [ "$UPDATE_STATUS" = "Successful" ]; then
              echo "function update sucess fully ..."
              break
            elif [ "$UPDATE_STATUS" = "Failed" ]; then
              echo "function code update failed"
              exit 1
            else
              echo "Update in progress, waiting..."
              sleep 5
            fi
          done

          # update function configuration
          aws lambda update-function-configuration \
          --function-name $FUNCTION_NAME \
          --region $REGION \
          --environment "$ENV_VARIABLES"
        fi

        